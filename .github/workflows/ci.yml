name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify app icon
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/app.ico")) {
            throw "assets/app.ico ausente — rode scripts/Convert-AppIcon.ps1"
          }

      - name: Restore
        run: dotnet restore TimeTracker.sln

      - name: Build
        run: dotnet build TimeTracker.sln -c Release --no-restore

      - name: Test
        run: dotnet test TimeTracker.sln -c Release --no-build --verbosity normal
