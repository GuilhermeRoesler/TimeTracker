name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($iscc) {
            Write-Host "Inno Setup já disponível: $iscc"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Publish framework-dependent + installer
        shell: pwsh
        run: |
          .\scripts\Publish-Release.ps1 -Version "${{ steps.version.outputs.tag }}"

      - name: Package portable zip (slim)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $outDir = "artifacts\release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zipName = "TimeTrackerPro-$version-portable-win-x64.zip"
          Compress-Archive -Path "artifacts\publish\*" -DestinationPath "$outDir\$zipName" -Force
          Copy-Item "artifacts\installer\TimeTrackerPro-$version-setup-win-x64.exe" $outDir -ErrorAction Stop
          Get-ChildItem $outDir | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTrackerPro-${{ steps.version.outputs.tag }}-windows
          path: artifacts/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TimeTracker Pro ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          files: artifacts/release/*
          body: |
            ## Instalação recomendada
            Baixe e execute **`TimeTrackerPro-*-setup-win-x64.exe`**.
            O instalador verifica e, se necessário, baixa o **.NET 8 Desktop Runtime** e o **ASP.NET Core Runtime**.

            ## Portable (avançado)
            O zip `*-portable-win-x64.zip` também exige .NET 8 Desktop + ASP.NET Core Runtime instalados no sistema.

            Dados do usuário: `%LocalAppData%\TimeTracker Pro\`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
