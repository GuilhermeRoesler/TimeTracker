<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTracker Pro — Painel de Produtividade</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="empty-state" class="empty-state hidden">
    <h2>Sem dados</h2>
    <p>Nenhum dado encontrado. Certifique-se de que o tracker está rodando (<code>run.bat</code> ou pelo ícone na bandeja).</p>
  </div>

  <div id="app-layout" class="layout hidden">
    <aside class="sidebar">
      <h2>Filtros</h2>
      <div id="date-shortcuts" class="shortcut-row"></div>
      <div class="date-nav">
        <button type="button" id="btn-prev-day" title="Dia anterior com registros">◀</button>
        <input type="date" id="date-picker" aria-label="Selecione a data" />
        <button type="button" id="btn-next-day" title="Próximo dia com registros">▶</button>
      </div>
      <p id="date-warning" class="warning hidden">Sem registros nesta data.</p>
      <button type="button" id="btn-refresh" class="btn-secondary">Atualizar Dados</button>
    </aside>

    <main class="main">
      <header class="page-header">
        <h1>📊 Painel de Produtividade Pessoal</h1>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="overview" role="tab">🏠 Visão Geral</button>
        <button type="button" class="tab" data-tab="details" role="tab">🔍 Detalhes por App</button>
        <button type="button" class="tab" data-tab="settings" role="tab">⚙️ Personalizar Apps</button>
      </nav>

      <section id="panel-overview" class="tab-panel" role="tabpanel"></section>
      <section id="panel-details" class="tab-panel hidden" role="tabpanel"></section>
      <section id="panel-settings" class="tab-panel hidden" role="tabpanel"></section>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
